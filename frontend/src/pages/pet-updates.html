<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pet Updates — PawInn</title>
    <link rel="icon" href="/assets/icons/paw.svg" />
    <link rel="stylesheet" href="/assets/styles.css" />
    <script defer src="/assets/app.js"></script>
  </head>
  <body x-data="shell" data-page="pet-updates">
    <!-- include:header -->
    <main id="main" class="wrap" x-data="petUpdates">
      <div class="page-intro flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1>Pet Updates</h1>
          <p class="muted">
            Daily reports, messages, and photos from the PawInn team.
          </p>
        </div>
        <button
          class="btn btn-outline"
          x-cloak
          x-show="$store.portal.user?.role==='CUSTOMER'"
          :disabled="loading"
          @click="load()"
        >
          Refresh updates
        </button>
      </div>
      <p class="notice" x-show="!$store.portal.ready" x-cloak>
        Loading your account…
      </p>
      <!-- include:customer-gate -->
      <section
        class="pb-16"
        x-show="$store.portal.user?.role==='CUSTOMER'"
        x-cloak
        aria-label="Updates from staff"
      >
        <p x-show="error" x-text="error" class="error mb-4" role="alert"></p>
        <p x-show="loading && !items.length" class="muted" role="status">
          Loading updates…
        </p>
        <div
          class="empty"
          x-show="loaded && !items.length && !loading && !error"
        >
          <h2>No pet updates yet.</h2>
          <p>Daily reports and quick updates from staff will appear here.</p>
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <template x-for="update in items" :key="update.id + ':' + (update.photoId || '')">
            <article class="card padded">
              <div class="flex flex-wrap justify-between gap-2 items-start">
                <div>
                  <h2 class="text-2xl" x-text="update.petName"></h2>
                  <p
                    class="text-xs muted"
                    x-text="'Booking #'+update.bookingId"
                  ></p>
                </div>
                <time
                  class="text-xs muted"
                  :datetime="update.createdAt"
                  x-text="timestamp(update.createdAt)"
                ></time>
              </div>
              <p
                class="mt-4 text-sm font-semibold"
                x-show="update.kind === 'report'"
                x-text="'Daily report · ' + reportDateLabel(update.reportDate)"
              ></p>
              <p
                class="mt-4 whitespace-pre-wrap break-words"
                x-show="update.message"
                x-text="update.message"
              ></p>
              <template x-if="update.kind === 'report' ? update.photoId : update.hasPhoto">
                <div class="mt-4" x-data="petUpdatePhoto(update)">
                  <p
                    class="text-xs muted"
                    x-show="!source && !error"
                    role="status"
                  >
                    Loading photo…
                  </p>
                  <p
                    class="text-xs error"
                    x-show="error"
                    x-text="error"
                    role="alert"
                  ></p>
                  <img
                    class="rounded-xl w-full max-h-96 object-contain bg-stone-100"
                    x-show="source"
                    :src="source || null"
                    :alt="'Photo of '+update.petName"
                  />
                </div>
              </template>
              <a
                class="text-link mt-4 inline-block"
                :href="careLink(update.bookingId)"
                :aria-label="'View stay care for ' + update.petName + ', booking ' + update.bookingId"
              >View stay care</a>
            </article>
          </template>
        </div>
        <button
          class="btn btn-outline mt-5"
          x-show="nextBefore"
          :disabled="loading"
          @click="load(nextBefore)"
        >
          Load older updates
        </button>
      </section>
    </main>
    <!-- include:footer -->
  </body>
</html>
