# Keep HTML fresh across frontend builds while allowing asset revalidation.
map $sent_http_content_type $page_cache_control {
    default "";
    ~^text/html no-store;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
        etag off;
        if_modified_since off;
    }
    location /assets/ {
        expires -1;
    }
    # Docker resolves service names again after a container is replaced.
    location ~ ^/api/(auth|users|pets|admin)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $account http://account:3001;
        proxy_pass $account;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        # Rate limiting at Account uses the proxy address in this local setup.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
    }
    location ~ ^/api/(room-types|rooms)(/|$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $room http://room:3002;
        proxy_pass $room;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location ~ ^/api/(availability|bookings|cancellations)(/|$) {
        client_max_body_size 3m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $booking http://booking:3003;
        proxy_pass $booking;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location /api/ { return 404; }
    add_header Cache-Control $page_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
