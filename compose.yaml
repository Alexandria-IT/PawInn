# PawInn application stack. PostgreSQL data stays in its named volume.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawinn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pawinn}
      PAWINN_SEED_DEMO: ${PAWINN_SEED_DEMO:-false}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -Atqc 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  account:
    image: ${PAWINN_IMAGE_PREFIX:-pawinn}-account:${PAWINN_TAG:-local}
    build: ./services/account
    environment:
      ACCOUNT_PORT: 3001
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pawinn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pawinn}
      JWT_SECRET: ${JWT_SECRET:-}
      PAWINN_SEED_DEMO: ${PAWINN_SEED_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(/* Use the HTTP status. */ r=>process.exit(r.ok?0:1),/* Fail if the service is unreachable. */ ()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  room:
    image: ${PAWINN_IMAGE_PREFIX:-pawinn}-room:${PAWINN_TAG:-local}
    build:
      context: ./services
      dockerfile: room/Dockerfile
    environment:
      ROOM_PORT: 3002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pawinn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pawinn}
      JWT_SECRET: ${JWT_SECRET:-}
      PAWINN_SEED_DEMO: ${PAWINN_SEED_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(/* Use the HTTP status. */ r=>process.exit(r.ok?0:1),/* Fail if the service is unreachable. */ ()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  booking:
    image: ${PAWINN_IMAGE_PREFIX:-pawinn}-booking:${PAWINN_TAG:-local}
    build:
      context: ./services
      dockerfile: booking/Dockerfile
    environment:
      BOOKING_PORT: 3003
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-pawinn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pawinn}
      JWT_SECRET: ${JWT_SECRET:-}
      PAWINN_SEED_DEMO: ${PAWINN_SEED_DEMO:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(/* Use the HTTP status. */ r=>process.exit(r.ok?0:1),/* Fail if the service is unreachable. */ ()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    image: ${PAWINN_IMAGE_PREFIX:-pawinn}-frontend:${PAWINN_TAG:-local}
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      account:
        condition: service_healthy
      room:
        condition: service_healthy
      booking:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/room-types"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
