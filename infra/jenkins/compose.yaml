# Start the local Jenkins controller from the PawInn checkout.
# docker compose --env-file .env -f infra/jenkins/compose.yaml up -d --build
name: pawinn-jenkins

services:
  jenkins:
    build: .
    # root + docker.sock = Jenkins can run Docker on this computer.
    # Fine for a local demo; do not expose this Jenkins to the internet.
    user: root
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-pawinn}
      JENKINS_PORT: ${JENKINS_PORT:-8081}
      PAWINN_REPO_URL: ${PAWINN_REPO_URL:-https://github.com/Alexandria-IT/PawInn.git}
      PAWINN_BRANCH: ${PAWINN_BRANCH:-*/main}
      PAWINN_DEPLOY_PROJECT: ${PAWINN_DEPLOY_PROJECT:-pawinn}
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8081}:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Share the settings used to initialize the application database.
      - type: bind
        source: ${PAWINN_ENV_FILE:-../../.env}
        target: /var/jenkins_home/pawinn-local.env
        read_only: true
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  jenkins_home:
